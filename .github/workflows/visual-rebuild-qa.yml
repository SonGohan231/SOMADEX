name: Visual rebuild QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/visual-rebuild-qa.yml'
      - 'THIRD_PARTY_NOTICES.md'

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch pinned CC0 pixel runtime assets
        shell: bash
        run: bash tools/fetch_cc0_pixel_assets.sh

      - name: Verify required art sources
        shell: bash
        run: |
          test -s assets/external/ninja_adventure/map/tileset_floor.png
          test -s assets/external/ninja_adventure/map/tileset_village.png
          test -s assets/external/ninja_adventure/map/tileset_animated.png
          test -s assets/external/ninja_adventure/character/player_base.png
          test -s assets/external/ninja_adventure/ui/font_normal.ttf

      - name: Build numbered tileset contact sheet
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make_cc0_contact_sheet.py

      - name: Upload visual QA sources
        uses: actions/upload-artifact@v4
        with:
          name: SOMADEX-visual-rebuild-QA
          path: build/visual_qa/*.png
          if-no-files-found: error
          retention-days: 14
