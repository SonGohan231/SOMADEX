name: Visual rebuild QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'tools/**'
      - '.github/workflows/visual-rebuild-qa.yml'
      - 'THIRD_PARTY_NOTICES.md'

jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch pinned CC0 pixel runtime assets
        shell: bash
        run: bash tools/fetch_cc0_pixel_assets.sh

      - name: Verify required art sources
        shell: bash
        run: |
          test -s assets/external/ninja_adventure/map/tileset_floor.png
          test -s assets/external/ninja_adventure/map/tileset_village.png
          test -s assets/external/ninja_adventure/map/tileset_animated.png
          test -s assets/external/ninja_adventure/character/player_base.png
          test -s assets/external/ninja_adventure/ui/font_normal.ttf

      - name: Build numbered tileset contact sheets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make_cc0_contact_sheet.py

      - name: Install Godot for runtime snapshot
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          wget -q "https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import visual runtime assets
        shell: bash
        run: godot --headless --path . --import --quit

      - name: Render actual current Vela runtime
        shell: bash
        run: xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://scripts/tests/render_world_snapshot.gd

      - name: Verify runtime screenshot
        shell: bash
        run: test -s build/visual_qa/current_world.png

      - name: Upload visual QA sources
        uses: actions/upload-artifact@v4
        with:
          name: SOMADEX-visual-rebuild-QA
          path: build/visual_qa/*.png
          if-no-files-found: error
          retention-days: 14
