name: Build SOMADEX Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GODOT_VERSION: 4.7.1
      GODOT_RELEASE: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot and export templates
        shell: bash
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -O templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -R /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Configure Godot Android paths and debug key
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 \
              -deststoretype pkcs12
          fi

          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import and compile Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" godot-import.log; then
            echo "GDScript compilation failed"
            exit 1
          fi

      - name: Smoke-test main scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 2 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" godot-smoke.log; then
            echo "Godot smoke test found script errors"
            exit 1
          fi

      - name: Validate Foundation 1.0 contracts
        shell: bash
        run: |
          godot --headless --path . --script res://scripts/tests/foundation_smoke.gd
          grep -q 'version/name="1.0.0"' export_presets.cfg
          grep -q 'version/code=10' export_presets.cfg

      - name: Validate Foundation 1.0 screen integration
        shell: bash
        run: godot --headless --path . --script res://scripts/tests/foundation_integration.gd

      - name: Validate Android/mobile title input
        shell: bash
        run: godot --headless --path . --script res://scripts/tests/mobile_input_smoke.gd

      - name: Validate 50-family creature catalog
        shell: bash
        run: godot --headless --path . --script res://scripts/tests/creature_catalog_smoke.gd

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SOMADEX-debug.apk
          test -s build/SOMADEX-debug.apk
          ls -lh build/SOMADEX-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOMADEX-Alpha1-Android-debug
          path: build/SOMADEX-debug.apk
          if-no-files-found: error
          retention-days: 14
